services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iiots_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    networks:
      - dmz_ot_net

  postgres:
    image: postgres:16-alpine
    container_name: iiots_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - it_db_net

  ingestor:
    build: ../ingestor-service
    container_name: iiots_ingestor
    restart: unless-stopped
    depends_on:
      - mosquitto
      - postgres
    environment:
      PG_USER: ${POSTGRES_USER}
      PG_PASS: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
      MQTT_USER: ${MQTT_INGESTOR_USER}
      MQTT_PASS: ${MQTT_INGESTOR_PASS}
    networks:
      - dmz_ot_net
      - it_db_net

networks:
  dmz_ot_net:
    driver: bridge
  it_db_net:
    driver: bridge

volumes:
  mosquitto_data:
  postgres_data:
